name: Publish CLI to npm

# Every release published here carries the caspian CLI's npm package,
# caspianmd-caspian-<version>.tgz, built from the same tag as the desktop app. This publishes that
# exact file to npm as @caspianmd/caspian, so `npm install -g @caspianmd/caspian` always matches the
# app's latest release.
#
# No token: npm Trusted Publishing. @caspianmd/caspian's settings on npmjs.com name this repo and
# this workflow file as its trusted publisher; the job proves it's that workflow with a GitHub
# OIDC token (id-token: write below), and npm publishes with provenance. Nothing to rotate or leak.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.3.1
        required: true

permissions:
  contents: read
  id-token: write # for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # No registry-url: that writes an .npmrc pointing at a token, and there is none.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@^11.5.1

      - name: Find the CLI package on the release
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pkg
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'caspianmd-caspian-*.tgz' --dir pkg; then
            echo "::notice::Release $TAG has no caspianmd-caspian-*.tgz — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "./" so npm reads it as a local file, not a GitHub "user/repo" shorthand.
          file=./$(ls pkg/caspianmd-caspian-*.tgz | head -n 1)
          version=$(tar -xOzf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$file is version $version but the release is $TAG — not publishing."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.pkg.outputs.skip != 'true'
        env:
          FILE: ${{ steps.pkg.outputs.file }}
          VERSION: ${{ steps.pkg.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if npm view "@caspianmd/caspian@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@caspianmd/caspian@$VERSION is already on npm — nothing to do."
            exit 0
          fi
          # A pre-release goes to the "next" tag so `npm install -g @caspianmd/caspian` doesn't pick it up.
          if [ "$PRERELEASE" = "true" ]; then
            npm publish "$FILE" --access public --tag next
          else
            npm publish "$FILE" --access public
          fi
          echo "::notice::Published @caspianmd/caspian@$VERSION"
